const charts={};
function killCharts(){Object.values(charts).forEach(c=>c.destroy());Object.keys(charts).forEach(k=>delete charts[k]);}
function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;charts[id]=new Chart(el,cfg);}

const CD={
  get light(){return (db.settings.theme||'light')==='light';},
  get color(){return this.light?'#3d2c6b':'#C4B8E8';},
  get gridColor(){return this.light?'rgba(61,44,107,.08)':'rgba(255,255,255,.06)';},
  get tickColor(){return this.light?'#6b5fa0':'#7C6FA0';},
};

function initCharts(){
  if(typeof Chart==='undefined'||!document.getElementById('weekC'))return;
  killCharts();
  Chart.defaults.color=CD.color;
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  const accent=db.settings.accentColor||'#7906FF', max=db.settings.dailyPts;
  const keys=lastDayKeys(mapaRange), today=todayStr();
  const labels=keys.map(k=>{const d=new Date(k+'T12:00:00');return mapaRange<=7?d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''):String(d.getDate());});
  const used=keys.map(k=>Math.min(dayLoad(k),max));
  const sin=keys.map(k=>(db.sintomas?.registros||[]).filter(r=>r.date===k).reduce((t,r)=>t+r.intensidade,0));
  const xTicks={color:CD.tickColor,font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:10};

  mkChart('weekC',{type:'bar',data:{labels,datasets:[{data:used,backgroundColor:keys.map(k=>k===today?accent:hexToRgba(accent,.3)),borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max,border:{display:false},grid:{color:CD.gridColor},ticks:{color:CD.tickColor,font:{size:10},maxTicksLimit:5}},x:{border:{display:false},grid:{display:false},ticks:xTicks}}}});

  mkChart('sintomasC',{type:'line',data:{labels,datasets:[
      {label:'Energia gasta',data:used,borderColor:accent,backgroundColor:hexToRgba(accent,.14),tension:.4,pointRadius:0,pointHitRadius:12,borderWidth:2.5,yAxisID:'y',fill:true},
      {label:'Carga de sintomas',data:sin,borderColor:'#F87171',backgroundColor:'rgba(248,113,113,.12)',tension:.4,pointRadius:0,pointHitRadius:12,borderWidth:2.5,yAxisID:'y2',fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,boxHeight:10,usePointStyle:true,padding:12,color:CD.color}}},
      scales:{y:{beginAtZero:true,max,border:{display:false},grid:{color:CD.gridColor},ticks:{color:CD.tickColor,font:{size:10},maxTicksLimit:5}},
        y2:{beginAtZero:true,max:Math.max(...sin,3)*1.3,position:'right',border:{display:false},grid:{display:false},ticks:{display:false}},
        x:{border:{display:false},grid:{display:false},ticks:xTicks}}}});

  const keySet=new Set(keys);
  const recentCi=db.checkins.filter(c=>keySet.has(c.date)&&c.humor);
  if(recentCi.length>0){
    const used2=HUMORS.filter(h=>recentCi.some(c=>c.humor===h.id));
    const datasets=used2.map(h=>({
      label:humorLabel(h),
      data:Object.keys(PERIODS).map(pid=>recentCi.filter(c=>c.period===pid&&c.humor===h.id).length),
      backgroundColor:h.color,borderRadius:6,borderSkipped:false,
    }));
    mkChart('humorC',{type:'bar',data:{labels:Object.values(PERIODS).map(p=>p.label),datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,boxHeight:10,usePointStyle:true,padding:10,color:CD.color}}},
        scales:{x:{stacked:true,border:{display:false},grid:{display:false},ticks:{color:CD.tickColor,font:{size:11}}},y:{stacked:true,beginAtZero:true,border:{display:false},grid:{color:CD.gridColor},ticks:{color:CD.tickColor,font:{size:10},precision:0,maxTicksLimit:5}}}}});
  }
}

const CONTENT={home:homeHTML,register:registerHTML,mapa:mapaHTML,sintomas:renderSintomas,diary:diaryHTML,sos:sosHTML,settings:settingsHTML};

function tourOverlayHTML(){
  const nome=db.settings.name?` ${db.settings.name}`:'';
  if(tourStep===1) return `
    <div style="position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="background:var(--card);border-radius:24px;padding:36px 24px;text-align:center;max-width:340px;width:100%">

        <div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:12px">Vamos explorar ${g('juntas','juntos','juntes')}!</div>
        <div style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px">Em 6 passos você vai <strong style="color:var(--text)">usar de verdade</strong> — não só ver. Toque quando ${g('estiver','estiver','estiver')} ${g('pronta','pronto','prontx')}.</div>
        <button onclick="tourNext()" style="width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit">Vamos lá →</button>
      </div>
    </div>`;
  if(tourStep===8) return `
    <div style="position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="background:var(--card);border-radius:24px;padding:36px 24px;text-align:center;max-width:340px;width:100%">
        <div style="font-size:56px;margin-bottom:16px">🎉</div>
        <div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:12px">${g('Pronta','Pronto','Prontx')}${nome}!</div>
        <div style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px">O segredo é o hábito: 3 check-ins por dia + um registro quando algo acontece. O diário é para quando você quiser desabafar. Os padrões aparecem com o tempo. 💜</div>
        <button onclick="tourNext()" style="width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit">Começar ✨</button>

function tourGuideBarHTML(){
  const guideSteps={
    2:{num:'1 de 6', title:'Check-in ✅', text:`3× por dia você registra como está: energia, humor e bateria social. Leva menos de 2 minutos. Vamos fazer o de agora?`, cta:'Fazer check-in →', action:'checkin'},
    3:{num:'2 de 6', title:'Diário 📔', text:'Um cantinho só seu para escrever como se sente, o que sente e por quê. É opcional, fica só no seu aparelho e, com o tempo, aparece nos insights do Mapa. Ele fica aqui, na barra de baixo.', cta:'Próximo →'},
    4:{num:'3 de 6', title:'Registrar ➕', text:'Aqui você marca o que drenou ou recarregou: reunião, barulho, descanso, música... Toque em uma categoria pra experimentar.', cta:'Próximo →'},
    5:{num:'4 de 6', title:'Sintomas 🩺', text:'Registre sintomas físicos e emocionais separados do gasto de energia — dor, ansiedade, sobrecarga sensorial. Cada corpo é único.', cta:'Próximo →'},
    6:{num:'5 de 6', title:'Mapa de padrões 📊', text:'Com o tempo você verá quais atividades mais drenam, qual período pesa mais e suas tendências emocionais. Quanto mais registrar, mais claro fica.', cta:'Próximo →'},
    7:{num:'6 de 6', title:'SOS 🆘', text:'Para momentos de sobrecarga: respiração guiada, ancoragem nos sentidos e o CVV (188). Sempre aqui quando precisar.', cta:'Próximo →'},
  };
  const s=guideSteps[tourStep];

  const dots=[2,3,4,5,6,7].map(i=>`<span style="width:6px;height:6px;border-radius:50%;background:${i===tourStep?'var(--accent)':'rgba(255,255,255,.2)'};display:inline-block;transition:background .2s"></span>`).join('');
  const ctaOnclick=s.action==='checkin'?'openCheckin()':'tourNext()';
  return `
    <div style="position:fixed;bottom:72px;left:0;right:0;z-index:2000;padding:0 12px 6px">
      <div style="background:var(--card);border:1.5px solid rgba(167,139,250,.45);border-radius:20px;padding:16px 18px 14px;box-shadow:0 -2px 28px rgba(0,0,0,.55)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:11px;font-weight:700;color:var(--accent-lt);letter-spacing:.5px;text-transform:uppercase">Passo ${s.num}</span>
          <div style="display:flex;gap:5px">${dots}</div>
        </div>
        <div style="font-weight:700;font-size:15px;color:var(--text);margin-bottom:6px">${s.title}</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:14px">${s.text}</div>
        <div style="display:flex;gap:8px;align-items:center">
          ${tourStep>2?`<button onclick="tourPrev()" style="background:none;border:1.5px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;padding:10px 12px;border-radius:12px;font-family:inherit;white-space:nowrap">← Voltar</button>`:''}
          <button onclick="${ctaOnclick}" style="flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">${s.cta}</button>
          <button onclick="tourNext()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0 4px;font-family:inherit;white-space:nowrap">Pular</button>
        </div>
      </div>
    </div>`;
}

function renderTourGuide(){
  const el=document.getElementById('tour-guide');
  if(!el) return;
  // Hide guide bar when any modal/sheet is open
  const modalOpen=!!(checkinState||sheetState||helpSheet||showFeedback||showDiaryRegister||onboardingStep>0||showBackupSheet);
  const active=tourStep>=2&&tourStep<=7&&!modalOpen;
  el.innerHTML=active?tourGuideBarHTML():'';
  // passo do Diário: destaca o card e leva até ele
  if(active&&tourStep===3){const c=document.getElementById('nav-diary');if(c)c.style.boxShadow='0 0 0 3px rgba(167,139,250,.6)';}
  else{const c=document.getElementById('nav-diary');if(c)c.style.boxShadow='';}
  const main=document.getElementById('main');
  if(main) main.style.paddingBottom=active?'210px':'';
}

function tourPrev(){
  if(tourStep>2){
    tourStep--;
    const tab=TOUR_TABS[tourStep];
    if(tab&&tab!==screen) go(tab);
    else { renderOverlays(); renderTourGuide(); }
  }
}
function tourNext(){
  if(tourStep<8){
    tourStep++;
    const tab=TOUR_TABS[tourStep];
    if(tab&&tab!==screen) go(tab);
    else { renderOverlays(); renderTourGuide(); }
  } else {
    tourStep=0; localStorage.setItem(TOUR_KEY,'1'); localStorage.setItem(DIARY_INTRO_KEY,'1');
    renderOverlays(); renderTourGuide();
    if(shouldShowCheckin()) setTimeout(openCheckin,400);
  }
}

// Ícones flat/coloridos em vez do emoji nativo do aparelho (Twemoji, carregado no <head>)
function applyFlatEmoji(el){
  if(!el||typeof twemoji==='undefined')return;
  try{twemoji.parse(el,{folder:'svg',ext:'.svg'});}catch(_){}
}
function renderOverlays(){
  const el=document.getElementById('overlays');if(!el)return;
  if(onboardingStep>0)              el.innerHTML=onboardingHTML();
  else if(tourStep===1||tourStep===8) el.innerHTML=tourOverlayHTML();
  else if(catInfoId)       el.innerHTML=catInfoHTML();
  else if(helpSheet)       el.innerHTML=helpSheetHTML();
  else if(showPrivacy)     el.innerHTML=privacyHTML();
  else if(showFeedback)    el.innerHTML=feedbackHTML();
  else if(checkinState)    el.innerHTML=checkinOverlayHTML();
  else if(triggerSheetState) el.innerHTML=triggerSheetHTML();
  else if(sheetState)      el.innerHTML=categorySheetHTML();
  else if(showReport)      el.innerHTML=reportSheetHTML();
  else if(showBackupSheet)  el.innerHTML=backupSheetHTML();
  else if(addSintomaSheet)  el.innerHTML=addSintomaSheetHTML();
  else if(sintomaEvolSheet){el.innerHTML=sintomaEvolSheetHTML();initEvolChart();}
  else if(showDiaryRegister) el.innerHTML=diaryRegisterSheetHTML();
  else if(_badgeQueue.length&&screen!=='sos') el.innerHTML=badgeCelebrateHTML();
  else if(showBadges)       el.innerHTML=badgesSheetHTML();
  else el.innerHTML='';
  applyFlatEmoji(el);
  renderTourGuide();
}

function render(){
  killCharts();
  document.getElementById('app').innerHTML=`
    <div class="hdr">
      <span class="hdr-title">${TITLES[screen]}</span>
      <div style="display:flex;align-items:center;gap:8px"><span class="beta-badge">beta</span><img src="icon.png" class="hdr-icon" style="width:28px;height:28px;border-radius:50%;object-fit:cover;cursor:pointer" onclick="go('home')" title="Ir para Hoje"></div>
    </div>
    <div id="update-banner" class="update-banner" style="display:${_pendingUpdate?'flex':'none'};margin:12px 16px 0;flex-direction:column;gap:8px;align-items:stretch">
      <div class="update-banner-txt">
        <strong>✨ Versão 2.25.0 disponível!</strong>
        Novidade: Diário novo, com seu mês em sentimentos, lembranças e pote de pequenas vitórias. E ainda Mapa em abas, selos e check-in de arrastar.</div>
      <div style="font-size:11px;font-weight:600;color:var(--warn-fg);display:flex;align-items:center;gap:5px">⚠️ Seus dados ficam só no seu aparelho — faça backup antes de atualizar.</div>
      ${_backupDoneForUpdate
        ? `<button class="update-banner-btn" onclick="dismissUpdate()">✅ Atualizar agora</button>`
        : `<button class="update-banner-btn" onclick="openBackupSheet()">📦 Fazer backup</button>
           <button onclick="dismissUpdate()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px;text-decoration:underline;font-family:inherit">já tenho backup recente → atualizar</button>`
      }
    </div>
    <div class="main" id="main">${CONTENT[screen]()}</div>
    <nav class="bnav">
      ${(()=>{const v=getVisitedTabs();return NAV.map(n=>`<button id="nav-${n.id}" class="nav-btn ${n.cls} ${screen===n.id?'on':''}" onclick="go('${n.id}')"><span class="nav-ico" style="position:relative">${n.icon}${n.id==='settings'?`<span class="nav-config-badge" style="display:${needsBackupReminder()?'block':'none'}"></span>`:!v[n.id]?'<span class="nav-new-badge"></span>':''}</span><span>${n.label}</span></button>`).join('');})()}
    </nav>`;
  applyFlatEmoji(document.getElementById('app'));
  renderOverlays();
  renderTourGuide();
  if(screen==='mapa')requestAnimationFrame(initCharts);
  if(screen==='sos')requestAnimationFrame(()=>{if(groundingStep>=0)renderGrounding();});
}

// ── VERSÃO / ATUALIZAÇÃO ─────────────────────────────────────────────────────
const APP_VERSION = '2.25.0';
const VERSION_KEY = 'recarregue_version';

function checkAppUpdate(){
  const stored = localStorage.getItem(VERSION_KEY);
  if(!stored){
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    return;
  }
  if(stored !== APP_VERSION){
    _pendingUpdate = true;
  }
}

function dismissUpdate(){
  // Não grava a versão daqui — este script pode já estar desatualizado (várias
  // versões podem ter saído desde que a página carregou). Só marca "estou
  // recarregando pra atualizar" e deixa a PRÓPRIA página nova, ao carregar,
  // gravar a versão real que ela representa. Sem isso, gravar APP_VERSION
  // (o valor antigo, preso neste script) faz o banner reaparecer de novo
  // depois do reload, mesmo já tendo "atualizado".
  try{sessionStorage.setItem('recarregue_reloading_for_update','1');}catch(_){}
  _pendingUpdate = false;
  location.reload();
}

// ── BOOT ──────────────────────────────────────────────────────────────────────

// Preview mode: ?preview=1 reseta só o estado de UI (onboarding/versão) sem apagar dados
// Nenhum trackEvent é disparado durante preview para não contaminar analytics
let PREVIEW_MODE = false;
if(new URLSearchParams(location.search).get('preview')==='1'){
  PREVIEW_MODE = true;
  localStorage.removeItem('recarregue_v1_onboarded');
  localStorage.removeItem('recarregue_version');
  localStorage.removeItem('recarregue_visited_tabs');
  history.replaceState(null,'',location.pathname);
}

load();try{checkBadges(true);}catch(_){}applyTheme();
checkAppUpdate();
// Se recarregou por causa do botão "Atualizar agora", esta é que é a versão real
// (a que acabou de carregar) — grava ela e não deixa o banner reaparecer.
try{
  if(sessionStorage.getItem('recarregue_reloading_for_update')){
    sessionStorage.removeItem('recarregue_reloading_for_update');
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    _pendingUpdate = false;
  }
}catch(_){}
// Inicia tour se onboarding já foi feito mas tour não, e usuário ainda não tem dados (novo usuário real)
if(localStorage.getItem(ONBOARDED_KEY)&&!localStorage.getItem(TOUR_KEY)&&db.checkins.length===0) tourStep=1;
render();
if(onboardingStep>0) scheduleOnboardRead();
// Sessão: só conta 1 por hora por dispositivo
const _lastSession = parseInt(localStorage.getItem('recarregue_last_session')||'0');
if(Date.now() - _lastSession > 3600000){
  localStorage.setItem('recarregue_last_session', Date.now());
  trackEvent('session_started',{
    returning: !!localStorage.getItem(ONBOARDED_KEY),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    lang: navigator.language,
    screen: `${screen.width}x${screen.height}`,
    platform: navigator.platform || navigator.userAgentData?.platform || 'unknown',
  });
}
if(onboardingStep===0&&!tourStep&&shouldShowCheckin())setTimeout(openCheckin,700);

// Verifica mensagens pendentes do dashboard (NPS, avisos, etc.)
(async function checkAppMessages(){
  if(onboardingStep>0) return; // não mostra durante onboarding
  try {
    const did = getDeviceId();
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/app_messages?device_id=eq.${did}&read_at=is.null&order=created_at.asc&limit=1`,
      {headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`}}
    );
    const msgs = await r.json();
    if(!Array.isArray(msgs)||!msgs.length) return;
    const msg = msgs[0];
    showAppBanner(msg);
  } catch(_){}
})();

function showAppBanner(msg){
  const existing = document.getElementById('app-banner');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'app-banner';
  el.style.cssText = 'position:fixed;bottom:80px;left:12px;right:12px;z-index:9999;background:linear-gradient(135deg,#8B5CF6,#6d28d9);border-radius:16px;padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;animation:slideUp .3s ease';
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <div style="font-size:14px;font-weight:700;color:#fff">${msg.title}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:4px">${msg.body}</div>
      </div>
      <button onclick="dismissAppBanner('${msg.id}')" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:99px;width:24px;height:24px;font-size:14px;cursor:pointer;flex-shrink:0">×</button>
    </div>
    ${msg.url ? `<a href="${msg.url}&msg_id=${msg.id}" target="_blank" onclick="dismissAppBanner('${msg.id}')" style="display:block;text-align:center;background:#fff;color:#6d28d9;border-radius:10px;padding:9px;font-size:13px;font-weight:700;text-decoration:none">Responder agora 💜</a>` : ''}
  `;
  document.body.appendChild(el);
}

async function dismissAppBanner(id){
  document.getElementById('app-banner')?.remove();
  await fetch(`${SUPABASE_URL}/rest/v1/app_messages?id=eq.${id}`,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({read_at: new Date().toISOString()})
  }).catch(()=>{});
}
if(db.settings.notifEnabled)scheduleNotifs();
if(typeof Notification!=='undefined'&&Notification.permission==='granted')subscribePush();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data?.type!=='SW_UPDATED') return;
    // Nova versão instalada — avisa sem forçar reload
    const t=document.createElement('div');
    t.setAttribute('style','position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#7C3AED;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;max-width:90vw;text-align:center');
    t.textContent='✨ Nova versão disponível — toque para atualizar';
    t.onclick=()=>location.reload();
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),12000);
  });
}

// Aplica agendamentos que já passaram do horário
applyDueScheduled();
// Verifica a cada 2 min se algum agendamento venceu
setInterval(applyDueScheduled, 120_000);


</script>
